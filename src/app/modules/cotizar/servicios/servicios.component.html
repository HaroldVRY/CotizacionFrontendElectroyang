<!-- Toast para mensajes -->
<p-toast></p-toast>

<p-toolbar styleClass="custom-toolbar">
  <ng-template #start>
    <div class="d-flex gap-2">
      <p-iconfield iconPosition="left">
        <p-inputicon>
          <i class="pi pi-search"></i>
        </p-inputicon>
        <input #searchInput pInputText type="text"
          (input)="dt1.filterGlobal(searchInput.value, 'contains'); onTableFilter()"
          placeholder="Buscar servicio..." />
      </p-iconfield>
      <p-button styleClass="btn-info  btn-md" severity="info"
        [icon]="filtrosVisibles ? 'pi pi-filter-slash' : 'pi pi-filter'" (click)="toggleFiltros()" label="Filtros" />
      <p-button styleClass="btn-danger  btn-md" severity="danger" label="Limpiar Filtros" icon="pi pi-times"
        (click)="clear(dt1, searchInput)" />
    </div>
  </ng-template>
  <ng-template #center>
    <h4>Lista de Servicios</h4>
  </ng-template>
  <ng-template #end>
    <p-button label="Nuevo Servicio" icon="pi pi-plus" severity="success" (onClick)="nuevoServicio()">
    </p-button>
  </ng-template>
</p-toolbar>

<p-divider></p-divider>

<p-table #dt1 [value]="serviciosFiltrados" [loading]="loading" [paginator]="true" [rows]="rows"
  [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [globalFilterFields]="['nombre', 'descripcion', 'precio', 'unidad']" styleClass="p-datatable-gridlines"
  responsiveLayout="scroll" showGridlines>
  <!-- Header -->
  <ng-template pTemplate="header">
    <tr class="text-center">
      <!-- Columnas dinámicas (explícitas) -->
      <th *ngFor="let col of columnasDinamicasVisibles" [pSortableColumn]="col.sortable ? col.field : undefined">
        <div class="d-flex gap-1 align-items-center justify-content-center">
          {{ col.header }}
          <p-sortIcon *ngIf="col.sortable" [field]="col.field">
            <ng-template pTemplate="default" let-sortOrder>
              <i *ngIf="sortOrder === 1" class="pi pi-sort-up sort-icon"></i>
              <i *ngIf="sortOrder === -1" class="pi pi-sort-down sort-icon"></i>
              <i *ngIf="sortOrder === 0 || sortOrder == null" class="pi pi-sort sort-icon"></i>
            </ng-template>
          </p-sortIcon>
        </div>
      </th>
    </tr>
    <!-- Fila de filtros dinámicos -->
    <tr class="filtro" [ngClass]="{'d-none': !filtrosVisibles}">
      <th *ngFor="let col of columnasDinamicasVisibles">
        <div class="w-100 p-1" *ngIf="col.filtrable">
          <!-- Input nombre -->
          <input *ngIf="col.field === 'nombre'" type="text" pInputText pSize="small" class="w-100 filtro-columna-input"
            [(ngModel)]="filtroNombre"
            (input)="dt1.filter($any($event.target).value, 'nombre', 'contains'); onTableFilter()"
            placeholder="Filtrar Nombre" />

          <!-- Input descripción -->
          <input *ngIf="col.field === 'descripcion'" type="text" pInputText pSize="small" class="w-100 filtro-columna-input"
            [(ngModel)]="filtroDescripcion"
            (input)="dt1.filter($any($event.target).value, 'descripcion', 'contains'); onTableFilter()"
            placeholder="Filtrar Descripción" />

          <!-- Input precio -->
          <input *ngIf="col.field === 'precio'" type="text" pInputText pSize="small"
            class="w-100 filtro-columna-input" [(ngModel)]="filtroPrecio"
            (input)="dt1.filter($any($event.target).value, 'precio', 'contains'); onTableFilter()"
            placeholder="Filtrar Precio" />

          <!-- Input unidad -->
          <input *ngIf="col.field === 'unidad'" type="text" pInputText pSize="small" class="w-100 filtro-columna-input"
            [(ngModel)]="filtroUnidad"
            (input)="dt1.filter($any($event.target).value, 'unidad', 'contains'); onTableFilter()"
            placeholder="Filtrar Unidad" />

          <!-- Dropdown estado -->
          <p-dropdown *ngIf="col.field === 'activo'"
            [(ngModel)]="filtroActivo"
            (onChange)="dt1.filter(filtroActivo, 'activo', 'equals'); onTableFilter()"
            [options]="estadoOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Estado"
            [showClear]="true"
            styleClass="w-100">
          </p-dropdown>
        </div>
      </th>
    </tr>
  </ng-template>

  <!-- Cuerpo dinámico -->
  <ng-template pTemplate="body" let-servicio let-rowIndex="rowIndex">
    <tr (click)="verDetalle(servicio)" style="cursor: pointer;" pTooltip="Click para ver detalles">
      <td *ngFor="let col of columnasDinamicas" class="cell-center" [ngClass]="{'d-none': col.field === 'acciones'}">
        <span *ngIf="col.field === 'id'" class="font-medium">{{ servicio.id }}</span>
        <span *ngIf="col.field === 'nombre'" class="font-medium text-primary">{{ servicio.nombre }}</span>
        <span *ngIf="col.field === 'descripcion'" [title]="servicio.descripcion">
          {{ servicio.descripcion?.length > 30 ? (servicio.descripcion | slice:0:30) + '...' : servicio.descripcion }}
        </span>
        <span *ngIf="col.field === 'precio'" class="text-primary font-semibold">
          {{ servicio.precio | currency:'USD':'symbol':'1.2-2' }}
        </span>
        <span *ngIf="col.field === 'unidad'">{{ servicio.unidad }}</span>
        <span *ngIf="col.field === 'activo'">
          <p-tag [value]="servicio.activo ? 'Activo' : 'Inactivo'"
                 [severity]="servicio.activo ? 'success' : 'danger'">
          </p-tag>
        </span>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="columnasDinamicasVisibles.length" class="text-center p-4">
        <div class="empty-state">
          <i class="pi pi-cog text-4xl text-gray-400 mb-3"></i>
          <p class="text-gray-600">No se encontraron servicios</p>
          <p-button label="Crear Primer Servicio" icon="pi pi-plus" severity="success" size="small"
            (onClick)="nuevoServicio()">
          </p-button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
