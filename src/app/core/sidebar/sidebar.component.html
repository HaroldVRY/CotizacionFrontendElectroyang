<div class="sidebar-container" *ngIf="open">
  <div class="sidebar-header">
    <h3 class="titulo">{{ titulo }}</h3>
  </div>

  <!-- Usar componentes personalizados como en toolbar -->
  <div class="sidebar-menu">
    <ul class="menu-list">
      <li *ngFor="let item of menuItems" class="menu-item">
        <app-sidebar-item [item]="item"></app-sidebar-item>
      </li>
    </ul>
  </div>
</div>
